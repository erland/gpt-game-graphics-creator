$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.invalid/game-graphics-creator/validation-report.schema.yaml"
title: Validation Report Data
type: object
additionalProperties: false
required: [packageId, packageVersion, scope, checks, overallStatus]
properties:
  packageId: {type: string}
  packageVersion: {type: string}
  scope:
    type: object
    additionalProperties: false
    required: [inspectedFiles]
    properties:
      inspectedFiles:
        type: array
        items: {type: string}
      affectedAssets:
        type: array
        items: {type: string}
  overallStatus: {enum: [Passed, Failed, Not verified]}
  maturityImpact:
    type: object
    additionalProperties: false
    properties:
      maximumSupportedMaturity:
        enum: [designSheet, prototypeAsset, productionCandidate, productionReady]
      reason: {type: string}
  assumptions:
    type: array
    items: {type: string}
  unresolvedQuestions:
    type: array
    items: {type: string}
  checks:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, category, requirementSource, acceptanceCriterion, status, affectedAssets, blocking, evidence]
      properties:
        id: {type: string, pattern: "^[A-Za-z0-9._-]+$"}
        category: {enum: [visual, technicalExport, manifest, requestAmbiguity, external]}
        requirementSource: {type: string}
        acceptanceCriterion: {type: string}
        status: {enum: [Passed, Failed, Not verified, Not applicable]}
        affectedAssets:
          type: array
          items: {type: string}
        blocking: {type: boolean}
        evidence: {type: string}
        externalOwner: {type: string}
        recommendedAction: {type: string}
  revision:
    type: object
    additionalProperties: false
    properties:
      required: {type: boolean}
      affectedAssets:
        type: array
        items: {type: string}
      regenerationScope:
        enum: [none, metadataOnly, deterministicReexport, selectiveAssetRegeneration, fullSeriesRegeneration]
      notes: {type: string}
  externalChecks:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, owner, status, description]
      properties:
        id: {type: string}
        owner: {type: string}
        status: {enum: [Passed, Failed, Not verified, Not applicable]}
        description: {type: string}
