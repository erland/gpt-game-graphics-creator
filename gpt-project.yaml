schema_version: 1
project:
  id: game-graphics-creator
  name: Game Graphics Creator
  profile: asset_pipeline_advanced

instructions:
  canonical: assistant/instructions.md
  legacy_source: builder/MAIN-INSTRUCTION.md
  preserve_legacy_source_byte_identical: true

knowledge_architecture:
  canonical_root: knowledge
  upload_manifest: builder/UPLOAD-MANIFEST.md
  expected_files: 13

runtime:
  chat_zip:
    enabled: true
  custom_gpt:
    enabled: true
    instruction:
      source: assistant/instructions.md
      packaging_path: builder/MAIN-INSTRUCTION.md
      max_characters: 8000
    knowledge:
      strategy: upload_manifest
      expected_files: 13
  claude:
    enabled: false
    compatibility: assessment_pending
  opencode:
    enabled: false
    compatibility: assessment_pending
  openai_plugin:
    enabled: false
    compatibility: assessment_pending

capabilities:
  critical:
    - image_generation
    - code_interpreter_and_data_analysis
  important:
    - image_upload_and_analysis
    - structured_asset_contracts
    - deterministic_file_validation
    - cumulative_zip_delivery
    - web_research_optional

release:
  version_file: VERSION
  preserve_current_version: true
  current_version: 1.0.0-rc2
  publication_status: private_until_preflight
  manual_preview_tests:
    manifest: tests/TEST-MANIFEST.yaml
    expected_status: notRun
    migration_may_mark_pass: false
