name: Validate GPT Byggaren 1.6.33 packages

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing pre-release tag to attach packages to (leave blank for validation only)'
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-source-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install PyYAML
      - name: Verify pinned engine sources and runtime configuration
        run: |
          test -f scripts/build_distributions.py
          test -f scripts/validate_distributions.py
          test -f scripts/lib/project_model.py
          test -f templates/START-HERE.chat.md.tpl
          python - <<'PYCODE'
          import yaml
          c=yaml.safe_load(open('gpt-project.yaml',encoding='utf-8'))
          for rt in ('chat_zip', 'claude', 'opencode', 'plugin'):
              assert c['runtime'][rt]['enabled'] is True, rt
          assert c['runtime']['custom_gpt']['enabled'] is False
          assert c['instructions']['mode'] == 'modular_skills'
          assert {s['id'] for s in c['skills']['definitions']} == {'graphics-creation', 'asset-production'}
          assert c['release']['current_version']==open('VERSION').read().strip()
          PYCODE
      - name: Resolve package version from release tag
        id: package_version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $RELEASE_TAG" >&2
              exit 1
            fi
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate G12 and G16 acceptance contracts
        run: python -m unittest discover -s tests/e2e -p 'test_acceptance_contracts.py' -v
      - name: Verify remaining G03-G15 test scenario fixtures
        run: python -m unittest discover -s tests/e2e/remaining -p 'test_remaining_fixtures.py' -v
      - name: Build enabled packages with original Engine 1.6.33
        run: python scripts/build_distributions.py --project-root . --version "${{ steps.package_version.outputs.version }}"
      - name: Validate generated distributions
        run: python scripts/validate_distributions.py --project-root .
      - name: Verify all five package targets
        run: |
          python - <<'PYCODE'
          import pathlib,zipfile
          d=pathlib.Path('dist'); z=list(d.glob('*.zip'))
          assert len(z)==6, [p.name for p in z]
          assert all(zipfile.is_zipfile(p) and zipfile.ZipFile(p).testzip() is None for p in z)
          assert any('-chat-' in p.name for p in z)
          assert all(any('-'+key+'-' in item.name for item in z) for key in ('project','claude-project','claude-skills','opencode','plugin'))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: game-graphics-creator-unreleased-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
          retention-days: 14

  publish-release-assets:
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    needs: validate-source-and-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: game-graphics-creator-unreleased-${{ github.sha }}
          path: dist
      - name: Upload verified packages to existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -n "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null
          gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt dist/DELIVERY-MANIFEST.json --clobber --repo "$GH_REPO"
