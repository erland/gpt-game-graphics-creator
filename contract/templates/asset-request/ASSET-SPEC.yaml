packageId: example_asset_request
packageVersion: 0.1.0
requestStatus: draft
requestedMaturity: prototypeAsset
defaults:
  transparentBackground: true
  outputMode: both
assets:
  - id: example_prop
    assetType: prop
    description: Replace with a concrete visual and technical request.
    technical:
      projection: isometric
      canvasSize: [128, 256]
      logicalTileSize: [128, 64]
      logicalFootprint: [1, 1]
      anchorPoint: [0.5, 0.12]
      visualOverflow: true
    acceptanceCriteria:
      - Transparent background.
      - Foot point remains consistent with the declared anchor.
    externalChecks:
      - SpriteKit placement and depth sorting.
