name: Validate GPT Byggaren 1.6.33 packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install PyYAML
      - name: Verify pinned engine sources
        run: |
          test -f scripts/build_distributions.py
          test -f scripts/validate_distributions.py
          test -f scripts/lib/project_model.py
          test -f templates/START-HERE.chat.md.tpl
          python - <<'PYCODE'
          import yaml
          c=yaml.safe_load(open('gpt-project.yaml',encoding='utf-8'))
          assert c['runtime']['chat_zip']['enabled'] is True
          for rt in ('claude','opencode','plugin','custom_gpt'):
              assert c['runtime'][rt]['enabled'] is False, rt
          assert c['release']['current_version']==open('VERSION').read().strip()
          PYCODE
      - name: Build enabled packages with installed original Engine 1.6.33
        run: python scripts/build_distributions.py --project-root . --version "$(cat VERSION)"
      - name: Validate generated distributions
        run: python scripts/validate_distributions.py --project-root .
      - name: Verify all five package targets
        run: |
          python - <<'PYCODE'
          import pathlib,zipfile
          d=pathlib.Path('dist'); z=list(d.glob('*.zip'))
          assert len(z)==6, [p.name for p in z]
          assert all(zipfile.is_zipfile(p) and zipfile.ZipFile(p).testzip() is None for p in z)
          assert any('-chat-' in p.name for p in z)
          assert all(any('-'+key+'-' in item.name for item in z) for key in ('project','claude-project','claude-skills','opencode','plugin'))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: game-graphics-creator-unreleased-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/DELIVERY-MANIFEST.json
          retention-days: 14
